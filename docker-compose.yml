services:
  period-app:
    build: .
    container_name: period-calendar-pro
    restart: always
    ports:
      - "3600:3600"
    volumes:
      - ./data:/data
    environment:
      - TZ=Asia/Shanghai
      - DB_PATH=/data/period.db
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASS=${SMTP_PASS:-}
      - EMAIL_TO=${EMAIL_TO:-}
      - WECHAT_APPID=${WECHAT_APPID:-}
      - WECHAT_SECRET=${WECHAT_SECRET:-}
      - WECHAT_TEMPLATE_ID=${WECHAT_TEMPLATE_ID:-}
      - APP_URL=${APP_URL:-http://localhost:3600}
